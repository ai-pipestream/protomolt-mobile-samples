[package]
name = "wire-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Host-side reference for the mobile byte ABI: the same calls the iOS and Android apps make, with real protobuf types"

# Path dependency while everything is local; becomes a rev-pinned git
# dependency on ai-pipestream/protomolt-search once this repository has a remote.
[dependencies]
protomolt-search-embedded = { path = "../../../protomolt-search/crates/protomolt-search-embedded" }
prost = "0.14"
prost-types = "0.14"
serde_json = "1"
# The sample's embedder, for `--meaning`: free text → vector → dense query.
court-embedder-ffi = { path = "../../embedder-ffi" }

[workspace]
