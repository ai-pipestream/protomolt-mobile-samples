[package]
name = "court-embedder-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "C and JNI surface over protomolt-embedder, owned by the mobile sample: text in, unit vector out"

# The engine's embedded runtime deliberately ships no embedder ("embeddings enter
# as caller-supplied vectors"), and protomolt-embedder is a dev-dependency there
# while its ownership is undecided. So the sample is the caller that supplies
# vectors, and this crate is how its Swift and Kotlin reach the Rust embedder.
# Nothing here touches the engine crate or its mobile ABI.
[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

# Path dependency while everything is local; becomes a rev-pinned git dependency
# on ai-pipestream/protomolt-search alongside tools/wire-probe.
[dependencies]
protomolt-embedder = { path = "../../protomolt-search/crates/protomolt-embedder" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true

[workspace]
