name: CourtSearch
options:
  bundleIdPrefix: ai.pipestream.samples
  deploymentTarget:
    iOS: "18.0"
packages:
  CourtSearchKit:
    path: CourtSearchKit
targets:
  CourtSearch:
    type: application
    platform: iOS
    sources:
      - CourtSearch
      # The Phase 1 embedding model (scripts/fetch-model.sh; 123 MB, not in git),
      # bundled as a folder. Optional: without it the app builds and runs with
      # keyword search and similar opinions, and hides search by meaning.
      - path: ../models/potion-retrieval-32M
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: CourtSearchKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Court Search
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
